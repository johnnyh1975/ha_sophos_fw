# Home Assistant integration quality scale — self-assessment for v1.1.0.
#
# All 54 rules of hassfest's rule list (script/hassfest/quality_scale.py).
# hassfest does not check this file for custom integrations, and no reviewer
# grades it: every "done" below names where it is fulfilled, so it can be
# checked against the code and the README.

rules:
  # ── Bronze ────────────────────────────────────────────────────────────────
  action-setup:
    status: exempt
    comment: No service actions; control is via switch and button entities.
  appropriate-polling:
    status: done
    comment: >
      Four tiers per endpoint (default 30 s / 2 min / 10 min / 30 min),
      configurable in the options; XML requests one at a time because the
      firewall answers them one after another.
  brands:
    status: done
    comment: >
      Local brand images in custom_components/sophos_firewall/brand/,
      shown by Home Assistant 2026.3 and newer; older versions show no logo.
      Not submitted to the home-assistant/brands repository.
  common-modules:
    status: done
    comment: coordinator.py (coordinators), entity.py (base entities).
  config-flow:
    status: done
    comment: >
      UI setup with data_description for every field; connection settings in
      data, everything else in options.
  config-flow-test-coverage:
    status: done
    comment: 100 % line and branch coverage of config_flow.py (tests/test_config_flow.py).
  dependency-transparency:
    status: done
    comment: >
      puresnmp==2.0.1 (MIT) is built and published to PyPI by a GitHub
      Actions job on the v2.0.1 tag (exhuma/puresnmp, pythonpackage.yml).
      The XML API client is part of this repository.
  docs-actions:
    status: exempt
    comment: No service actions.
  docs-conditions:
    status: exempt
    comment: No device conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: No device triggers.
  entity-event-setup:
    status: exempt
    comment: Entities subscribe to nothing; all data comes from the coordinators.
  entity-unique-id:
    status: done
    comment: >
      "{config entry id}_{object}" — not host or IP, which change (migrated
      from "{host}_{port}_{object}" in config entry version 2).
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: The config flow tests the XML API (and SNMP when enabled) before creating the entry.
  test-before-setup:
    status: done
    comment: >
      Setup fetches the admin settings: unreachable → ConfigEntryNotReady,
      rejected credentials → ConfigEntryAuthFailed, API access denied (532/534)
      → ConfigEntryNotReady plus a repair issue.
  unique-config-entry:
    status: done
    comment: unique_id "{host}:{port}"; checked by the user and reconfigure flows.

  # ── Silver ────────────────────────────────────────────────────────────────
  action-exceptions:
    status: done
    comment: >
      Switch and button actions raise translated HomeAssistantError
      (write_failed, backup_failed) for API errors and timeouts.
  config-entry-unloading:
    status: done
    comment: >
      Platforms unloaded; the dedicated XML session is closed, also after a
      failed or cancelled setup and when Home Assistant stops.
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: >
      Per endpoint: an entity is unavailable when the fetch that feeds it
      failed; a failed SNMP read never becomes a made-up 0.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >
      An unreachable source is logged once by the coordinator, a failing
      endpoint once when it starts and once when it recovers.
  parallel-updates:
    status: done
    comment: 0 for the coordinator-fed sensors, 1 for switch and button (one write at a time).
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: >
      At least 95 % line coverage in every module, enforced in CI
      (scripts/check_coverage_per_module.py on the HA 2026.8 job).

  # ── Gold ──────────────────────────────────────────────────────────────────
  devices: done
  diagnostics:
    status: done
    comment: >
      Endpoint states and parsed data; credentials, community, host, serial
      number and static DHCP leases redacted.
  discovery:
    status: exempt
    comment: >
      SFOS announces itself through none of the mechanisms Home Assistant
      discovers (zeroconf, SSDP, …); as the network's gateway its LAN
      address is static, so it never appears as a DHCP client either.
  discovery-update-info:
    status: exempt
    comment: No discovery (see above).
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One device per config entry (the firewall); its objects are entities, not devices.
  entity-category:
    status: done
    comment: >
      Versions, temperatures, fans, PSUs, last boot, HA status and peer,
      backup frequency, per-service and per-license sensors → diagnostic;
      backup button and switches → config.
  entity-device-class:
    status: done
    comment: >
      Timestamp (last boot), data rate / data size (traffic), temperature,
      connectivity, power, running, ENUM for every state list.
  entity-disabled-by-default:
    status: done
    comment: >
      Rarely used entities start disabled: swap, FTP/SMTP/IMAP/POP3 counters,
      versions, fans, HA peer, backup frequency, read-only rule sensors, CPU
      cores, per-service and per-license sensors, byte counters, traffic of
      interfaces the XML API does not list.
  entity-translations: done
  exception-translations:
    status: done
    comment: Every raised HomeAssistantError, UpdateFailed and ConfigEntryAuthFailed is translated.
  icon-translations:
    status: done
    comment: icons.json with state icons; no icon is set in code.
  reconfiguration-flow:
    status: done
    comment: Host, port and credentials; refuses an address another entry already uses.
  repair-issues:
    status: done
    comment: >
      api_access_denied (532/534, until access works) and snmp_unreachable
      (agent silent for 10 minutes since setup, warning); cleared on recovery,
      when SNMP is switched off and when the entry is disabled or removed.
  stale-devices:
    status: exempt
    comment: >
      One device per config entry, removed with the entry. Stale entities
      (vanished interfaces, rules, tunnels, …) are removed from the registry.

  # ── Platinum ──────────────────────────────────────────────────────────────
  async-dependency:
    status: done
    comment: >
      puresnmp is asyncio-based; the XML client uses aiohttp. puresnmp's
      plugin discovery imports modules, so it runs once in the import
      executor during setup (SNMPClient.preload), never in the event loop.
  inject-websession:
    status: done
    comment: >
      The XML client takes its session as an argument. The integration
      passes a dedicated session whose connector never reuses a connection:
      SFOS hangs on reused keep-alive connections, and Home Assistant's shared
      session pools them (reproduced in tests/test_sophos_client.py).
  strict-typing:
    status: done
    comment: >
      mypy --strict without disabled error codes, run in CI against the
      minimum Home Assistant (.github/workflows/typing.yml); typed dataclass
      models for all data.
