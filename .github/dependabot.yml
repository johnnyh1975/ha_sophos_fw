version: 2
updates:
  # requirements-test.txt — pinned test/CI dependencies (newer tested HA). Pinning keeps
  # CI reproducible; this keeps it from going stale by surfacing upgrades as
  # reviewable PRs instead of surprises.
  #
  # Weekly (not daily): this is test tooling, not runtime code shipped to
  # users — no urgency that would justify daily PR noise.
  #
  # No `labels:` here, deliberately: Dependabot requires a label to already
  # exist in the repo before it can apply it, and it errors out if it doesn't.
  # If you want categorisation, create "dependencies" and "ci" under
  # Settings → Labels first, then add `labels: ["dependencies"]` here.
  #
  # .github/ci/requirements-test-min.txt (minimum supported HA) is outside
  # this directory on purpose and is never bumped automatically.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The workflow files themselves (actions/checkout, actions/setup-python,
  # hacs/action, home-assistant/actions, softprops/action-gh-release, ...).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
