name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# Cancels superseded runs on rapid successive pushes to the same PR/branch,
# so CI minutes aren't spent on runs whose result no longer matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  test:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same two Home Assistant versions Roomba+ tests.
          # Oldest supported (hacs.json):
          - name: "HA 2025.5 minimum"
            id: ha2025.5
            python: "3.13"
            requirements: .github/ci/requirements-test-min.txt
            coverage: false
          # Newer version — Dependabot proposes bumps as PRs. Coverage is
          # measured here only: on Python 3.14 coverage.py uses
          # sys.monitoring (COVERAGE_CORE=sysmon), so branch coverage costs
          # little instead of doubling the run time.
          - name: "HA 2026.8"
            id: ha2026.8
            python: "3.14"
            requirements: requirements-test.txt
            coverage: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.requirements }}

      - name: Run full test suite
        if: ${{ !matrix.coverage }}
        run: python -m pytest tests/ -n auto -q

      - name: Run full test suite with coverage
        if: ${{ matrix.coverage }}
        env:
          COVERAGE_CORE: sysmon
        run: |
          python -m pytest tests/ -n auto -q --cov=custom_components/sophos_firewall \
            --cov-branch --cov-report=term-missing --cov-report=xml

      # The quality scale's test-coverage rule asks for more than 95 % in
      # every module. Counted exactly from coverage.xml: the terminal report
      # rounds (94.6 % prints as 95 %). Branch coverage is printed per module
      # for information only.
      - name: Check 95 % line coverage in every module
        if: ${{ matrix.coverage }}
        run: python scripts/check_coverage_per_module.py coverage.xml

      - name: Upload coverage report
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.id }}
          path: coverage.xml
          retention-days: 30

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      # Rule selection and the deliberate exclusion of `ruff format` are
      # documented in pyproject.toml's [tool.ruff] section — read that
      # before adding rules here.
      - name: Run ruff check
        run: ruff check custom_components/

  translations:
    name: Translation Completeness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check strings.json vs. all translations/*.json
        run: python3 scripts/check_translations.py

  version-badge:
    name: Version Badge Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Guards against the README version badge drifting away from
      # manifest.json between releases — a drift that is easy to miss by
      # hand and confusing for users comparing the two.
      - name: Check README badge vs. manifest.json
        run: python3 scripts/check_version_badge.py

  markdown-links:
    name: Markdown Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No continue-on-error here: unlike the repo this script came from,
      # every relative link in this project's README.md and docs/ currently
      # resolves cleanly, so the check can be a hard gate from day one.
      # If it starts flagging an anchor with an emoji or em-dash heading,
      # see the known limitation documented in the script's own docstring
      # before assuming the link is genuinely broken.
      - name: Check relative markdown links
        run: python3 scripts/check_markdown_links.py
