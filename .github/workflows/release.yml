name: Release

# Two ways to run this:
# 1. Push a tag matching v*.*.* (e.g. `git tag v1.0.3 && git push --tags`) — runs automatically.
# 2. Actions tab → Release → "Run workflow" → enter a tag manually. Useful for a
#    safe first test: use a throwaway tag like v0.0.1-test, then delete the
#    resulting release + tag afterwards from the Releases page if it was just a test.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to package and release (e.g. v1.0.3). Use a throwaway tag like v0.0.1-test for a safe test run."
        required: true
        type: string

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG} -> Version: ${VERSION}"

      - name: Validate manifest.json version matches tag
        run: |
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('custom_components/sophos_firewall/manifest.json'))['version'])")
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::manifest.json version ($MANIFEST_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi
          echo "Version check passed: $MANIFEST_VERSION"

      # Zero-failure-before-packaging as a pipeline gate, not a convention
      # someone has to remember. Placed right after the cheap version-string
      # check, before spending any time on release-notes lookup or packaging.
      # Same full-suite run (no --ignore flags) as validate.yml's test job,
      # kept deliberately consistent: the PR gate and the release gate should
      # never silently test different things.
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-test-frozen.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test-frozen.txt

      - name: Run full test suite (release gate — must pass before packaging)
        run: python -m pytest tests/ -q

      - name: Prepare release notes
        id: notes
        run: |
          NOTES_FILE="release-notes/${{ steps.version.outputs.tag }}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No $NOTES_FILE found — release will be created without a notes body. Commit it before tagging next time."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # ── HACS zip_release packaging ──────────────────────────────────────
      #
      # CRITICAL — read before changing this step.
      #
      # hacs.json sets "zip_release": true and "filename": "sophos_firewall.zip".
      # HACS therefore downloads THAT asset from this release and extracts its
      # ENTIRE contents directly into custom_components/sophos_firewall/ with
      # NO path stripping. (This differs from the non-zip_release path, which
      # does strip a custom_components/<domain>/ prefix from the repo archive.)
      #
      # Consequences, both of which the validation step below enforces:
      #   * The zip ROOT must contain the integration's bare files —
      #     manifest.json, __init__.py, translations/, brand/ — NOT wrapped in
      #     a custom_components/sophos_firewall/ folder. Wrapping it produces
      #     custom_components/sophos_firewall/custom_components/sophos_firewall/...
      #     for every user, i.e. a broken install.
      #   * hacs.json must NOT be inside the zip. HACS reads it from the repo
      #     root via the GitHub API, never from this asset.
      #
      # The asset filename must stay in sync with hacs.json's "filename".
      - name: Build HACS install ZIP
        run: |
          mkdir -p /tmp/hacs-package
          cp -r custom_components/sophos_firewall/. /tmp/hacs-package/
          cd /tmp/hacs-package
          zip -r "${GITHUB_WORKSPACE}/sophos_firewall.zip" .

      # Makes the two rules above a pipeline gate rather than something a
      # human has to remember at packaging time.
      - name: Validate HACS ZIP structure
        run: |
          echo "Checking sophos_firewall.zip structure..."
          FILE_LIST=$(unzip -l sophos_firewall.zip | awk 'NR>3 {print $4}' | grep -v '^$')

          if ! echo "$FILE_LIST" | grep -qx "manifest.json"; then
            echo "::error::manifest.json not found at zip root — is custom_components/sophos_firewall/ wrapped instead of flattened?"
            echo "$FILE_LIST"
            exit 1
          fi

          if echo "$FILE_LIST" | grep -q "custom_components"; then
            echo "::error::Found a 'custom_components' path inside the zip — this is the doubled-nesting bug. The zip must contain the bare files of custom_components/sophos_firewall/ directly, not the folder itself."
            echo "$FILE_LIST" | grep "custom_components"
            exit 1
          fi

          if echo "$FILE_LIST" | grep -qx "hacs.json"; then
            echo "::error::hacs.json found inside the zip — it must NOT be included; HACS reads it from the repo root via the GitHub API, never from this asset."
            exit 1
          fi

          echo "sophos_firewall.zip structure OK: manifest.json at root, no custom_components/ wrapper, no hacs.json."

      # Separate, human-facing artefact: the full repo (source + tests + docs
      # + CI) for manual install, review or archiving. HACS never reads this
      # one — only sophos_firewall.zip above.
      - name: Build full-review ZIP
        run: |
          mkdir -p /tmp/full-package
          cp -r custom_components /tmp/full-package/
          cp -r tests /tmp/full-package/
          cp -r docs /tmp/full-package/
          cp -r scripts /tmp/full-package/
          cp -r .github /tmp/full-package/
          cp hacs.json README.md LICENSE pyproject.toml /tmp/full-package/
          cp requirements-test-frozen.txt /tmp/full-package/
          if [ "${{ steps.notes.outputs.found }}" = "true" ]; then
            cp "${{ steps.notes.outputs.path }}" "/tmp/full-package/RELEASE_NOTES_${{ steps.version.outputs.tag }}.md"
          fi
          cd /tmp/full-package
          zip -r "${GITHUB_WORKSPACE}/ha_sophos_fw-${{ steps.version.outputs.tag }}-full.zip" .

      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.notes.outputs.found == 'true' && steps.notes.outputs.path || '' }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, 'b') || contains(steps.version.outputs.tag, 'rc') }}
          files: |
            sophos_firewall.zip
            ha_sophos_fw-${{ steps.version.outputs.tag }}-full.zip
